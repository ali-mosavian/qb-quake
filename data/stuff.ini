
//
// If you're having a hard time getting it to work 
// try this:
//
// sound.enabled = false
// display.xres = 320
// display.yres = 200
// display.usepaging = no
//
//
//
// sound.enabled = Enabled/disables sound
// display.clear = Clear the display each frame
// display.pages = If using paging, this tells how many
//                 pages it should use
// display.usepaging = Wether or not to use paging, if this
//                     option is no, a backbuffer is used.
//
//
// world.frustum.zn = The near plane of the frustum
// world.frustum.zf = The far plane of the frustum
// world.camera.script = The name of the camera "script"
// world.camera.interp = How many points to generate from each
//                       cubic bezier.
// world.camera.mode = freelook 
//                     script_play
//                     script_edit
//
// Disabled by default: sound init spins with interrupts off before any
// video mode change, so the program hangs with the screen still at the
// DOS prompt while the DOSBox title bar shows it running. Unresolved.
// Every build copies this file over the one in build/, so setting it
// there instead does not survive a rebuild.
sound.enabled = false

display.xres = 320
display.yres = 200

// The RENDER target, centred on the mode above. Smaller costs less
// conventional memory -- the backbuffer is x*y bytes and it is the
// largest single allocation the program makes. Omit for a full screen.
render.xres = 160
render.yres = 100
display.clear = yes
display.pages = 8
display.usepaging = no

world.frustum.zn = 1.0
world.frustum.zf = 4096.0
world.camera.script = rf.scr
world.camera.interp = 130
world.camera.mode = freelook
// u3dMtrxPersp's fov is VERTICAL (mdu3d.asm: h=cot(fov/2) lands in m22,
// the y row; x gets h/aspect). id Quake's own "fov" cvar is HORIZONTAL,
// default 90 at 4:3 -- 73.74 is the vertical angle that reproduces that
// same 90-degree horizontal view at this renderer's own 4:3 aspect
// (DISPLAY_W/DISPLAY_H, bspfile.bi): 2*atan(tan(45)/(4/3)).
world.camera.fov = 73.74
