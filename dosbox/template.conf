[sdl]
machine=svga_s3
output=surface
showdetails=false
showbasic=false
[dosbox]
memsize=64
startquiet=true
startbanner=false
[cpu]
core=dynamic
cputype=pentium_iii
cycles=max
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
[autoexec]
@echo off
mount c @CDRIVE@
mount v @VDRIVE@
mount m @MDRIVE@
set INCLUDE=M:\INC
c:
@PRE@
@BAT@
exit
