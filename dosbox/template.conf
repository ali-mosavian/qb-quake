[sdl]
# Keep the emulator at a raised priority in the foreground and normal when
# it loses focus, so a timed run is not competing with whatever else the
# host is doing. A benchmark that drifts with host load is not a benchmark.
priority=higher,normal
machine=svga_s3
output=surface
showdetails=false
showbasic=false
[dosbox]
memsize=64
startquiet=true
startbanner=false
[cpu]
# THE pinned emulated machine. core=dynamic, cycles=75000, and
# priority=higher,normal in [sdl]. These three go together and they are not
# tuning knobs: a before/after is only a measurement if both sides ran on
# the same machine, and cycles=max makes "the same machine" vary with host
# load. Override CYCLES/CORE only with a reason you can state.
core=dynamic
cputype=pentium_iii
cycles=75000
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
[autoexec]
@echo off
mount c @CDRIVE@
mount v @VDRIVE@
mount m @MDRIVE@
set INCLUDE=M:\INC
c:
@PRE@
@BAT@
exit
