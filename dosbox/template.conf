[sdl]
machine=svga_s3
output=surface
showdetails=false
showbasic=false
[dosbox]
memsize=64
startquiet=true
startbanner=false
[cpu]
# normal, NOT dynamic: mgl patches immediates straight into its own inner
# loops at runtime -- 8plxt.asm and friends have __IMM16__ patch points. The
# dynamic core has to spot writes to code pages and throw away translations,
# which is both slower here and a correctness risk. Timings taken under the
# dynamic core do not carry over.
core=normal
cputype=pentium_iii
cycles=max
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
[autoexec]
@echo off
mount c @CDRIVE@
mount v @VDRIVE@
mount m @MDRIVE@
set INCLUDE=M:\INC
c:
@PRE@
@BAT@
exit
