[sdl]
# No "are you sure" on the way out. DOSBox-X reads this in [sdl]; it spent
# a long time in [dosbox], where nothing reads it, and every window asked
# anyway. Every run here is scripted or watched, and a modal dialog on a
# keypress turns a finished run into what looks like a hang.
quit warning=false
# Keep the emulator at a raised priority in the foreground and normal when
# it loses focus, so a timed run is not competing with whatever else the
# host is doing. A benchmark that drifts with host load is not a benchmark.
priority=higher,normal
machine=svga_s3
output=surface
showdetails=false
showbasic=false
[dosbox]
memsize=64
startquiet=true
startbanner=false
[cpu]
# THE pinned emulated machine. core=dynamic, cycles=75000, and
# priority=higher,normal in [sdl]. These three go together and they are not
# tuning knobs: a before/after is only a measurement if both sides ran on
# the same machine, and cycles=max makes "the same machine" vary with host
# load. Override CYCLES/CORE only with a reason you can state.
core=dynamic
cputype=pentium_iii
cycles=75000
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
# the card dsp.asm programs: 220h, IRQ 7, DMA 1 -- the emulator's own defaults, pinned
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
[autoexec]
@echo off
mount c @CDRIVE@
mount v @VDRIVE@
c:
@PRE@
@BAT@
exit
